<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Q-PROOF Compact — the verified quantum circuit optimizer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#161d3f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- before circuit: dense -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="48" y1="88"  x2="300" y2="88"/>
    <line x1="48" y1="128" x2="300" y2="128"/>
    <line x1="48" y1="168" x2="300" y2="168"/>
  </g>
  <g fill="#64748b">
    <rect x="66"  y="74" width="28" height="28" rx="5"/>
    <rect x="108" y="114" width="28" height="28" rx="5"/>
    <rect x="150" y="74" width="28" height="28" rx="5"/>
    <rect x="192" y="154" width="28" height="28" rx="5"/>
    <rect x="234" y="114" width="28" height="28" rx="5"/>
    <circle cx="96" cy="168" r="6"/>
    <circle cx="96" cy="88" r="6"/>
    <circle cx="222" cy="128" r="6"/>
    <circle cx="222" cy="88" r="6"/>
    <line x1="96" y1="88" x2="96" y2="168" stroke="#64748b" stroke-width="2"/>
    <line x1="222" y1="88" x2="222" y2="128" stroke="#64748b" stroke-width="2"/>
  </g>
  <text x="48" y="205" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#64748b" letter-spacing="3">BEFORE</text>

  <!-- arrow -->
  <g stroke="url(#accent)" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="330" y1="128" x2="392" y2="128"/>
    <path d="M380 114 L396 128 L380 142" fill="none"/>
  </g>

  <!-- after circuit: sparse + proof seal -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="428" y1="88"  x2="640" y2="88"/>
    <line x1="428" y1="128" x2="640" y2="128"/>
    <line x1="428" y1="168" x2="640" y2="168"/>
  </g>
  <g fill="#94a3b8">
    <rect x="446" y="74" width="28" height="28" rx="5"/>
    <rect x="520" y="114" width="28" height="28" rx="5"/>
    <circle cx="590" cy="88" r="6"/>
    <circle cx="590" cy="128" r="6"/>
    <line x1="590" y1="88" x2="590" y2="128" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <circle cx="700" cy="128" r="34" fill="url(#seal)"/>
  <path d="M684 128 L696 140 L718 114" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="428" y="205" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#64748b" letter-spacing="3">AFTER — PROVEN</text>

  <!-- wordmark -->
  <text x="790" y="130" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">Q-PROOF</text>
  <text x="790" y="200" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="url(#accent)">COMPACT</text>
  <text x="792" y="243" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#8ea0c4">the verified quantum circuit optimizer</text>
  <rect x="790" y="224" width="88" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
