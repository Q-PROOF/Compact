name: CI

on:
  # PRs, manual, and every push to main (public repo: Actions minutes are free)
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Version-consistency lint
        run: python scripts/version_lint.py
      - name: Run test suite (zero dependencies)
        run: python tests/run_tests.py
      - name: Objective-mode tests
        run: python tests/test_objectives.py
      - name: Verification-API tests
        run: python tests/test_verify_api.py
      - name: Trust-layer tests
        run: python tests/test_trust_layer.py
      - name: Adversarial red-team suite
        run: python tests/test_adversarial_v024.py
      - name: Tier-boundary suite
        run: python tests/test_tier_boundaries.py
      - name: Checker-independence suite
        run: python tests/test_checker_independence.py
      - name: Compositional-certificate suite
        run: python tests/test_compositional_certs.py
      - name: Sliding-window prover suite
        run: python tests/test_sliding_windows.py
      - name: Benchmark provenance gate (blocking)
        run: python scripts/check_provenance.py
      - name: Quick benchmark (regression guard)
        run: python -m compactq.bench --quick
        continue-on-error: true

  regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install numpy + qiskit + pytket
        run: pip install numpy "qiskit==2.5.2" "pytket==2.18.1" "pytket-qiskit"
      - name: Optimization regression gate
        run: python scripts/bench_gate.py
      - name: Transpiler-pass integration suite (qiskit + pytket)
        run: python tests/test_transpiler_passes.py
