name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Manual publish target (test = TestPyPI dry run)"
        type: choice
        options: ["none", "test"]
        default: "none"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version-consistency lint
        run: python scripts/version_lint.py
      - name: Test suite (zero dependencies)
        run: python tests/run_tests.py
      - name: Objective-mode tests
        run: python tests/test_objectives.py
      - name: Verification-API tests
        run: python tests/test_verify_api.py
      - name: Trust-layer tests
        run: python tests/test_trust_layer.py
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      - name: Attach artifacts to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          overwrite_files: true

  publish-pypi:
    # Tag push v* -> PyPI. Uses the PYPI_API_TOKEN repository secret.
    # Idempotent: re-running a tag whose version is already on PyPI skips
    # the upload instead of failing. No secret configured -> clean skip.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI (idempotent)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::notice::PYPI_API_TOKEN secret is not set on this repository - skipping PyPI upload. Add it under Settings > Secrets and variables > Actions to enable CI publishing."
            exit 0
          fi
          pip install twine
          twine upload --skip-existing --non-interactive dist/*

  publish-testpypi:
    # Manual dispatch with target=test -> TestPyPI dry run.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'test'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: testpypi
    permissions:
      contents: read
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to TestPyPI (idempotent)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN_TESTPYPI }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::notice::PYPI_API_TOKEN_TESTPYPI secret is not set - skipping TestPyPI upload."
            exit 0
          fi
          pip install twine
          twine upload --skip-existing --non-interactive --repository-url https://test.pypi.org/legacy/ dist/*
