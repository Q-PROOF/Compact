[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "compactq-check"
version = "0.1.0"
description = "Independent checker for Compact compilation certificates — zero dependencies, shares no code with compactq"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Q-PROOF contributors" }]
keywords = ["quantum", "verification", "certificate", "checker"]

[project.scripts]
compactq-check = "compactq_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
