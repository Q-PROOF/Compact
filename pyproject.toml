[project]
name = "compactq"
version = "0.2.6"
description = "Q-PROOF Compact: the verified quantum circuit optimizer. Smaller circuits, proven. Error suppression included."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Q-PROOF contributors" }]
keywords = ["quantum", "compiler", "optimizer", "transpiler", "circuit", "qiskit", "compact", "verified", "error-suppression", "dynamical-decoupling", "pauli-twirling", "noise"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.optional-dependencies]
bench = ["qiskit>=1.0"]
dev = ["pytest>=7"]
# integration extras (v0.2.4): one pattern, extras on this package
qiskit = ["qiskit>=1.0"]
pytket = ["pytket>=1.0", "pytket-qiskit"]
integrations = ["qiskit>=1.0", "pytket>=1.0", "pytket-qiskit"]

[project.scripts]
compactq = "compactq.__main__:main"
compact-bench = "compactq.bench:main"

[project.urls]
Homepage = "https://github.com/Q-PROOF/Compact"
Repository = "https://github.com/Q-PROOF/Compact"
Issues = "https://github.com/Q-PROOF/Compact/issues"
Changelog = "https://github.com/Q-PROOF/Compact/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["compactq*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
